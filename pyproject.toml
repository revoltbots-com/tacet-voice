[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tacet"
version = "2.0.0"
description = "Speech-to-text dictation, refined. Real-time voice transcription with intelligent text processing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Revolt Bots LLC", email = "hello@revoltbots.com"},
]
keywords = ["speech-to-text", "dictation", "whisper", "transcription", "voice"]
dependencies = [
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "faster-whisper>=0.10.0",
    "pynput>=1.7.6",
    "requests>=2.31.0",
    "customtkinter>=5.2.0",
    "pyperclip>=1.8.0",
    "pystray>=0.19.0",
    "Pillow>=9.0.0",
    "pywin32>=305; sys_platform == 'win32'",
    "winshell>=0.6; sys_platform == 'win32'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://revoltbots.com"
Repository = "https://github.com/revoltbots-com/tacet-voice"
Issues = "https://github.com/revoltbots-com/tacet-voice/issues"

[project.scripts]
tacet = "tacet.gui.app:main"

[project.optional-dependencies]
gpu = ["ctranslate2>=3.20.0"]

[tool.setuptools.packages.find]
include = ["tacet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
